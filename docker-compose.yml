version: '3.8'

services:
  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - cisco-xdr-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ELASTIC_CLOUD_ID=${ELASTIC_CLOUD_ID}
      - ELASTIC_API_KEY=${ELASTIC_API_KEY}
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - CISCO_XDR_API_KEY=${CISCO_XDR_API_KEY}
      - CISCO_XDR_BASE_URL=${CISCO_XDR_BASE_URL}
      - ELASTIC_1CHAT_API_KEY=${ELASTIC_1CHAT_API_KEY}
      - ELASTIC_1CHAT_MODEL=${ELASTIC_1CHAT_MODEL}
      - DEMO_MODE=true
      - MOCK_DATA_ENABLED=true
    networks:
      - cisco-xdr-network

  # Elasticsearch (for local development)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cisco-xdr-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cisco-xdr-network

  # Kibana (for local development)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: cisco-xdr-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - cisco-xdr-network

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: cisco-xdr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cisco-xdr-network

  # Nginx (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: cisco-xdr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - cisco-xdr-network

volumes:
  elasticsearch_data:
  redis_data:

networks:
  cisco-xdr-network:
    driver: bridge
