service: cisco-xdr-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    NODE_ENV: ${self:provider.stage}
    ELASTIC_CLOUD_ID: ${env:ELASTIC_CLOUD_ID}
    ELASTIC_API_KEY: ${env:ELASTIC_API_KEY}
    ELASTIC_USERNAME: ${env:ELASTIC_USERNAME}
    ELASTIC_PASSWORD: ${env:ELASTIC_PASSWORD}
    CISCO_XDR_API_KEY: ${env:CISCO_XDR_API_KEY}
    CISCO_XDR_BASE_URL: ${env:CISCO_XDR_BASE_URL}
    ELASTIC_1CHAT_API_KEY: ${env:ELASTIC_1CHAT_API_KEY}
    ELASTIC_1CHAT_MODEL: ${env:ELASTIC_1CHAT_MODEL, 'gpt-4'}
    DEMO_MODE: ${env:DEMO_MODE, 'true'}
    MOCK_DATA_ENABLED: ${env:MOCK_DATA_ENABLED, 'true'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
    - Effect: Allow
      Action:
        - es:ESHttpGet
        - es:ESHttpPost
        - es:ESHttpPut
        - es:ESHttpDelete
      Resource: "*"

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

functions:
  api:
    handler: src/handler.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

custom:
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0
